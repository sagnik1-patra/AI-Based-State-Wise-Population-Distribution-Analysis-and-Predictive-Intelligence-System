project: AI-Based State-Wise Population Distribution Analysis and Predictive Intelligence
  System
algorithm: Particle Swarm Optimization
dataset: RS_Session_259_AU_88_1.csv
seed: 42
pso_parameters:
  swarm_size: 25
  iterations: 80
  inertia_weight: 0.7
  cognitive_coefficient: 1.5
  social_coefficient: 1.5
  position_noise: 0.1
  velocity_limit: 0.15
neural_network:
  architecture:
  - 1
  - 16
  - 8
  - 2
  - 8
  - 16
  - 1
  epochs: 150
  batch_size: 8
  learning_rate: 0.001
evaluation:
  type: Held-out reconstruction
  test_size: 0.2
